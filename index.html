/* ---- custom checkbox ---- */
input[type=checkbox]{-webkit-appearance:none;appearance:none;flex:none;width:20px!important;height:20px!important;margin:0;padding:0;border-radius:6px;background:#060a12;border:1.5px solid color-mix(in srgb,var(--g) 40%,var(--bd));display:inline-grid;place-items:center;cursor:pointer;transition:.15s;position:relative}
input[type=checkbox]::after{content:'';width:5px;height:10px;border:solid #030712;border-width:0 2.2px 2.2px 0;transform:rotate(45deg) scale(0);margin-top:-2px;transition:transform .15s ease}
input[type=checkbox]:hover:not(:disabled){border-color:var(--g)}
input[type=checkbox]:checked{background:linear-gradient(135deg,var(--g),var(--g2));border-color:var(--g);box-shadow:0 0 10px color-mix(in srgb,var(--g) 45%,transparent)}
input[type=checkbox]:checked::after{transform:rotate(45deg) scale(1)}
input[type=checkbox]:disabled{opacity:.45;cursor:not-allowed}
input[type=checkbox]:focus-visible{outline:2px solid var(--g);outline-offset:2px}

.row input:not([type=checkbox]),.row select,.row>button{height:30px}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
nav{overflow:visible;gap:0;padding:4px 2px calc(4px + env(safe-area-inset-bottom,0px))}
nav button{min-width:0;flex:1 1 0;font-size:.64em;padding:5px 0;gap:1px;white-space:nowrap}
nav button span{font-size:1.4em}
nav button.on::before{top:-4px}
.nb{position:absolute;top:1px;inset-inline-end:14%;min-width:15px;height:15px;border-radius:8px;background:var(--r);color:#fff;font-size:1.05em;line-height:15px;padding:0 3px;text-align:center}
#sb{bottom:calc(70px + env(safe-area-inset-bottom,0px))}
/* ---- trade ---- */
.tdh{background:linear-gradient(165deg,color-mix(in srgb,var(--g2) 26%,var(--s1)),var(--s1) 72%);border-color:color-mix(in srgb,var(--g) 30%,var(--bd))}
.tdw{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.tdw>div{background:#060a12;border:1px solid var(--bd);border-radius:10px;padding:7px 4px;text-align:center}.tdw small{display:block;color:var(--m);font-size:.72em}.tdw b{font-size:1.05em;color:var(--g)}
.tdr{display:flex;align-items:center;gap:10px;background:#060a12;border:1px solid var(--bd);border-inline-start:3px solid var(--g);border-radius:10px;padding:9px 11px;margin-top:8px}
.av2{width:40px;height:40px;border-radius:50%;background:var(--s3) center/cover;border:2px solid var(--g);display:grid;place-items:center;color:var(--g);flex:none}
.tdm{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.tdm label{display:block;background:#060a12;border:1px solid var(--bd);border-radius:10px;padding:6px 8px;text-align:center;font-size:.8em;color:var(--m)}
.tdm input{display:block;width:100%!important;margin-top:3px;text-align:center;height:30px;font-size:1.1em;font-weight:700;color:var(--t)}
.tdi{display:flex;align-items:center;gap:9px;background:var(--s2);border:1px solid var(--bd);border-inline-start:3px solid var(--rc);border-radius:10px;padding:8px 10px;margin:6px 0;transition:.15s}
.tdi.on{background:color-mix(in srgb,var(--rc) 11%,var(--s2));border-color:var(--rc)}
.tdi .ico{color:var(--rc);text-shadow:0 0 8px var(--rc);flex:none}
.tdn{flex:1;min-width:0}.tdn b{display:block;font-weight:600;font-size:.92em}.tdn small{display:block;color:var(--m);font-size:.72em}
.tds{background:#060a12;border:1px solid color-mix(in srgb,var(--g) 40%,var(--bd));border-radius:12px;padding:11px 12px;margin:10px 0}
.tdb{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tdp{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:14px;border:1px solid var(--rc,var(--g));color:var(--t);background:color-mix(in srgb,var(--rc,var(--g)) 12%,transparent);font-size:.8em}.tdp i{font-style:normal;color:var(--rc,var(--g));font-weight:700}.tdp.mon{--rc:#f5b942}
.tdc{background:var(--s2);border:1px solid var(--bd);border-inline-start:4px solid var(--tc);border-radius:12px;padding:10px 11px;margin:8px 0}
.tdt{display:flex;align-items:center;gap:9px}.tda{font-size:1.4em;color:var(--tc);line-height:1;flex:none}
.tds2{font-size:.7em;color:var(--tc);border:1px solid var(--tc);border-radius:10px;padding:1px 9px;white-space:nowrap}
.tdq{margin-top:6px;padding:6px 10px;background:#060a12;border-radius:8px;font-size:.84em;color:var(--m);line-height:1.7}

/* ---- wizard ---- */
.wzs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.wzs>div{text-align:center}
.wzs span{display:grid;place-items:center;width:26px;height:26px;margin:0 auto 3px;border-radius:50%;background:var(--s3);color:var(--m);font-weight:700;font-size:.85em;border:1px solid var(--bd)}
.wzs .on span{background:var(--g);color:#030712;border-color:var(--g);box-shadow:0 0 12px color-mix(in srgb,var(--g) 45%,transparent)}
.wzs .dn span{color:var(--g);border-color:var(--g)}
.wzs small{display:block;font-size:.7em;color:var(--m);line-height:1.3}.wzs .on small{color:var(--t)}
.wzn{margin:12px 0}.wzn button{height:38px;font-size:.9em}

/* ---- smoothness ---- */
html{touch-action:manipulation}
button,nav,.ddt{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:active:not(:disabled){transform:scale(.95)}
nav button{transition:color .15s,background .15s,transform .1s}nav button:active{transform:scale(.9)}
main.an>*{animation-duration:.2s}
.clp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.3,.7,.2,1),margin .3s}
.clp.open{grid-template-rows:1fr}
.clp>div{min-height:0;overflow:hidden;visibility:hidden;opacity:0;transition:opacity .2s ease,visibility 0s .3s}
.clp.open>div{visibility:visible;opacity:1;transition:opacity .25s ease .06s,visibility 0s}
.rings{gap:0 14px}.rings>*{margin-bottom:14px}.rings>.clp{margin-bottom:0}.rings>.clp.open{margin-bottom:14px}
.dgb{transition:opacity .15s}.dgb:active{opacity:.75}
details[open]>*:not(summary){animation:up .22s ease}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

details.dz>summary{list-style:none;display:flex;align-items:center;gap:6px}
details.dz>summary::-webkit-details-marker{display:none}
details.dz>summary::before{content:'◂';display:inline-block;font-size:.85em;transition:transform .25s}
details.dz.op>summary::before{transform:rotate(-90deg)}
details.dz>.clp{animation:none!important}

/* ---- potion workshop ---- */
.slg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
.slt{background:var(--s2);border:1px dashed var(--bd);border-radius:10px;padding:8px 10px;min-height:44px;display:flex;align-items:center;gap:6px;font-size:.84em;color:var(--m)}
.slt b{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}.slt small{color:var(--m);font-size:.85em}
.slt.f{border-style:solid;color:var(--t);border-color:color-mix(in srgb,var(--g) 55%,var(--bd));background:color-mix(in srgb,var(--g) 9%,var(--s2))}
.slt.f.mn2{border-color:#f5b94299;background:#f5b9421a}
.slt button{height:22px;padding:0 7px}

/* ---- smooth collapse ---- */
.clp{transition:grid-template-rows .38s cubic-bezier(.22,1,.36,1),margin .38s cubic-bezier(.22,1,.36,1)}
.clp>div{transform:translateY(-8px);transition:opacity .2s ease,transform .38s cubic-bezier(.22,1,.36,1),visibility 0s .38s}
.clp.open>div{transform:none;transition:opacity .3s ease .05s,transform .38s cubic-bezier(.22,1,.36,1),visibility 0s}
.dgb{transition:opacity .15s,transform .12s}.dgb:active{transform:scale(.985)}
.pnl .dfb:disabled{opacity:.45}
/* ---- recipe registry ---- */
.rgc{background:linear-gradient(165deg,color-mix(in srgb,var(--g2) 18%,var(--s1)),var(--s1) 70%);border-color:color-mix(in srgb,var(--g) 28%,var(--bd));padding:14px}
.rgh{display:flex;align-items:center;gap:8px}.rgh h3{margin:0;flex:1}
.rgs{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:10px 0}
.rgd{height:34px;padding:0;border-radius:8px;background:#060a12;color:var(--m);border:1px solid var(--bd);display:grid;place-items:center;position:relative;font-weight:700}
.rgd.f{color:var(--t);border-color:color-mix(in srgb,var(--g) 45%,var(--bd))}.rgd.f::after{content:'';position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--g)}
.rgd.on{background:var(--g);color:#030712;border-color:var(--g)}.rgd.on::after{background:#030712}
.rgf{margin-top:10px}.rgf label{display:flex;justify-content:space-between;font-size:.82em;color:var(--m);margin-bottom:4px}
.rgf textarea{display:block;width:100%;min-height:110px;resize:vertical;background:#060a12;line-height:1.9;padding:9px 11px;border-radius:9px;font-size:.88em}
/* ---- character menu ---- */
.cho{gap:10px;padding:8px 10px}
.cav{width:36px;height:36px;border-radius:50%;background:var(--s3) center/cover;border:1.5px solid var(--g);display:grid;place-items:center;color:var(--g);flex:none;font-size:.9em}
.cav.sm{width:20px;height:20px;display:inline-grid;vertical-align:middle;margin-inline-end:6px;font-size:.7em;border-width:1px}
.cin{flex:1;min-width:0;display:flex;flex-direction:column;text-align:start}.cin b{font-size:.95em;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cin small{color:var(--m);font-size:.74em}

/* ---- dossier card ---- */
.dsr{background:linear-gradient(165deg,color-mix(in srgb,var(--g2) 14%,var(--s1)),var(--s1) 65%);border-color:color-mix(in srgb,var(--g) 22%,var(--bd))}
.dsr .ig{gap:8px}
.dsi{display:grid;grid-template-columns:34px 1fr;column-gap:10px;align-items:center;background:#060a12;padding:9px 12px}
.dsi .dic{grid-row:1/span 4;grid-column:1;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--g) 12%,var(--s3));color:var(--g);font-size:1.1em}
.dsi>:not(.dic){grid-column:2;min-width:0}.dsi.wd{grid-column:1/-1}
.dtg{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.dsp{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:12px;border-radius:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--g2) 26%,#060a12),#060a12);border:1px solid color-mix(in srgb,var(--g) 38%,var(--bd))}
.dpi{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--g),var(--g2));color:#030712;font-size:1.3em;flex:none}
.dpb{flex:1;min-width:0}.dpb small{display:block;color:var(--m);font-size:.72em}.dpb>b{font-size:1.05em}.dps{font-size:.8em;color:var(--m);margin-top:2px}
.dpb>.dd{display:flex;width:100%;height:30px;margin-top:3px}
.dsq{flex:1 0 100%;display:flex;gap:3px}.dsq i{flex:1;height:5px;border-radius:3px;background:var(--s3)}.dsq i.p{background:color-mix(in srgb,var(--g) 50%,var(--s3))}.dsq i.on{background:var(--g);box-shadow:0 0 8px var(--g)}

/* ---- pro vitals / stats / accordions ---- */
.vt{background:#060a12;border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.vt .sh{align-items:center;margin-bottom:8px}
.vt .sh>span{display:flex;align-items:center;gap:8px;color:var(--t);font-weight:600;font-size:.92em}
.vi{font-style:normal;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--vc) 18%,#060a12);color:var(--vc);font-size:.95em}
.vr{display:flex;align-items:center;gap:8px}.vt .sh b{font-size:1.1em}
.vt .bar{height:8px}.vt .bar i{box-shadow:0 0 10px color-mix(in srgb,var(--vc) 45%,transparent)}
.vt.lo .bar i{animation:vlo 1.4s ease-in-out infinite}@keyframes vlo{50%{opacity:.5}}
.vc{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--s3);color:var(--g);display:grid;place-items:center;font-size:.75em;flex:none}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stt{background:#060a12;border:1px solid var(--bd);border-radius:12px;padding:10px 4px 8px;text-align:center;position:relative;overflow:hidden}
.stt::before{content:'';position:absolute;inset-inline:25%;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--g),transparent)}
.stt i{font-style:normal;color:var(--g);font-size:1.15em;display:block}.stt b{display:block;font-size:1.45em;line-height:1.25}.stt small{color:var(--m);font-size:.72em}
.asm{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:4px}
.asm>div{background:#060a12;border:1px solid var(--bd);border-top:3px solid var(--ac);border-radius:10px;padding:6px 4px;text-align:center}
.asm small{display:block;color:var(--m);font-size:.7em}.asm b{color:var(--ac);font-size:1.25em;line-height:1.3}
.ach{display:flex;align-items:center;gap:10px;width:100%}
.aci{font-style:normal;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--g) 14%,var(--s3));color:var(--g);flex:none}
.ach h3{margin:0;flex:1;text-align:start}.ach h3::before{display:none}

/* ---- svg icons ---- */
.ic{width:1.1em;height:1.1em;vertical-align:-.2em;display:inline-block;flex:none;margin-inline-end:.3em}
:is(.dic,.aci,.vi,.ci,.tda,.ico,.pnh span,.dfb>span,.stt i,.av,.mo,.cav,.dpi,nav span,.vc,.tb,.avx,.ddo i,.wzs span,.mn,.lb,.tgl,.pl) .ic{margin:0}
.dfb>span .ic,.stt i .ic{width:1.15em;height:1.15em}
.landing .mo .ic{filter:drop-shadow(0 0 14px color-mix(in srgb,var(--g) 55%,transparent));stroke-width:1.5}
nav button span .ic{width:1.15em;height:1.15em}
.av>.ic{stroke-width:1.5}

/* ---- special conditions: vivid colored icons ---- */
.cb{color:var(--t);border-inline-start:3px solid var(--cc,var(--g));font-weight:600}
.cb .ci{width:34px;height:34px;border-radius:10px;font-size:1.2em;filter:none;color:var(--cc);background:color-mix(in srgb,var(--cc) 18%,var(--s3));border:1px solid color-mix(in srgb,var(--cc) 45%,transparent);box-shadow:0 0 10px color-mix(in srgb,var(--cc) 22%,transparent)}
.cb .ci .ic{width:1.25em;height:1.25em;stroke-width:2.2;filter:drop-shadow(0 0 4px color-mix(in srgb,var(--cc) 70%,transparent))}
.cb:hover:not(:disabled){border-color:var(--cc);background:color-mix(in srgb,var(--cc) 8%,var(--s2))}
.cb.on{background:color-mix(in srgb,var(--cc) 20%,var(--s2));border-color:var(--cc);color:#fff;box-shadow:0 0 16px color-mix(in srgb,var(--cc) 40%,transparent)}
.cb.on .ci{background:var(--cc);color:#05070d;border-color:var(--cc);box-shadow:0 0 12px var(--cc)}
.cb.on .ci .ic{filter:none}
.fx>div b .ic{width:1.15em;height:1.15em}

/* ---- brand: eye instead of letter badge + crescent ---- */
header h1::before{display:none!important;content:none!important}
header h1 .ic,.acard h1 .ic{width:26px;height:26px;margin:0;flex:none;color:var(--g);stroke-width:1.6;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--g) 55%,transparent))}
.acard h1{display:flex;align-items:center;gap:9px}
.landing .mo .ic{width:1em;height:1em}

/* ---- smoother, lighter collapse ---- */
.clp{transition:grid-template-rows .24s cubic-bezier(.2,.8,.2,1),margin .24s cubic-bezier(.2,.8,.2,1)}
.clp>div{transform:none;contain:layout style;transition:opacity .12s linear,visibility 0s .24s}
.clp.open>div{transform:none;transition:opacity .18s ease,visibility 0s}
header,nav{backdrop-filter:none;-webkit-backdrop-filter:none}
.ab{transition:none}
.ab.t5{animation:none;position:relative}
.ab.t5::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:0 0 44px color-mix(in srgb,var(--ac) 65%,transparent);opacity:0;animation:abq 3s ease-in-out infinite}
@keyframes abq{50%{opacity:1}}
details.dz>summary::before{transition:transform .18s}
/* ---- power modifier ---- */
.pwh{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.pwb{flex:none;min-width:88px;text-align:center;background:#060a12;border:1px solid var(--g);border-radius:12px;padding:6px 8px;box-shadow:0 0 14px color-mix(in srgb,var(--g) 22%,transparent)}
.pwb small{display:block;color:var(--m);font-size:.68em}.pwb b{font-size:1.3em;color:var(--g)}

/* ---- sanity panel under the bar ---- */
.msb{display:flex;align-items:center;gap:10px;background:#060a12;border:1px solid color-mix(in srgb,var(--sc) 55%,var(--bd));border-inline-start:4px solid var(--sc);border-radius:12px;padding:8px 12px;margin-bottom:8px;box-shadow:0 0 14px color-mix(in srgb,var(--sc) 18%,transparent)}
.msb i{width:10px;height:10px;border-radius:50%;background:var(--sc);box-shadow:0 0 10px var(--sc);flex:none}
.msb b{display:block;color:var(--sc);font-size:.98em}.msb small{color:var(--m);font-size:.72em}
.clp>div>.hlb+.hlb{margin-top:8px}
.pnc .row input.wd{flex:1 1 56px!important;width:auto!important;min-width:0!important}

/* ---- typing fix: no persistent animation fill on tab switch ---- */
main.an>*{animation-fill-mode:backwards}
/* ---- route tab (professional) ---- */
.rsr{display:flex;align-items:center;gap:10px;background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:9px 11px;margin:7px 0 0;transition:border-color .18s,background .18s,box-shadow .18s}
.rsn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--s3);color:var(--m);border:1.5px solid var(--bd);flex:none}
.rsr:not(.lk) .rsn{background:linear-gradient(135deg,var(--g),var(--g2));color:#030712;border-color:var(--g)}
.rsr.cu{border-color:color-mix(in srgb,var(--g) 55%,var(--bd));box-shadow:0 0 14px color-mix(in srgb,var(--g) 22%,transparent)}
.rsr.on{border-color:var(--g);background:color-mix(in srgb,var(--g) 9%,var(--s2))}
.rsr.lk{opacity:.5}
.rsb{flex:1;min-width:0;text-align:start}.rsb b{display:block;font-weight:600;font-size:.95em;color:var(--t);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rsb small{color:var(--m);font-size:.72em}
.rsp{background:#060a12;border:1px solid var(--bd);border-radius:12px;padding:10px;margin:6px 0 10px;animation:up .22s ease}
.rst{font-size:.74em;color:var(--m);margin:14px 0 6px;display:flex;align-items:center;gap:8px;letter-spacing:.04em}.rst::after{content:'';flex:1;height:1px;background:var(--bd)}.rst:first-child{margin-top:2px}
.rbg{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.rbt{background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:7px 4px;text-align:center}.rbt b{display:block;font-size:1.25em;line-height:1.2}.rbt small{color:var(--m);font-size:.72em}
.rab{background:var(--s2);border:1px solid var(--bd);border-inline-start:3px solid var(--rc,var(--g));border-radius:11px;margin:7px 0;overflow:hidden}
.rab .fh{padding:9px 10px;gap:6px}.rab .fh+div{margin-top:0}
.rab .dgb .l1{gap:9px}.rab .dgb .l1 b{font-weight:600;font-size:.95em;text-align:start}
.rai{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:.78em;font-weight:700;background:color-mix(in srgb,var(--rc,var(--g)) 18%,var(--s3));color:var(--rc,var(--g))}
.rab .rtx{margin:0 12px;padding:10px 2px 12px;border-top:1px solid var(--bd);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.95;font-size:.86em}
.rtk{color:var(--rc,var(--g))}.rtn{color:#f5b942}
.rab .rar{margin-inline-start:2px}
.rtb{display:flex;gap:6px;margin:8px 0 2px}.rtb button{flex:1;height:28px}
.rth .dsq{margin-top:14px}
.rsub{margin:0 10px 10px}.rsub .rst{margin:6px 0}.rab .rab{background:#060a12;margin:6px 0}
.wl{font-size:1.05em;line-height:1.8;margin:6px 0 16px}.ld{width:28px;height:28px;margin:0 auto 6px;border:3px solid var(--bd);border-top-color:var(--g);border-radius:50%;animation:spn 1s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}#aretry{display:none}


/* ---- path emblem ---- */
.emb{position:relative;width:128px;height:128px;margin:2px auto 8px;display:grid;place-items:center;-webkit-user-select:none;user-select:none}
.emb::before{content:'';position:absolute;inset:-22px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--g) 40%,transparent) 0,color-mix(in srgb,var(--g) 12%,transparent) 48%,transparent 70%);animation:embp 4.5s ease-in-out infinite}
.emb::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:1px dashed color-mix(in srgb,var(--g) 38%,transparent);animation:embr 60s linear infinite}
.emb img{position:relative;z-index:1;height:112px;width:auto;max-width:100%;filter:drop-shadow(0 0 9px color-mix(in srgb,var(--g) 60%,transparent)) drop-shadow(0 0 22px color-mix(in srgb,var(--g) 30%,transparent));pointer-events:none}
@keyframes embp{50%{opacity:.55;transform:scale(.94)}}
@keyframes embr{to{transform:rotate(360deg)}}
/* ---- route tab: compact ---- */
.rth{padding:10px 10px 9px}.rth .pth-s{font-size:.76em}.rth .dsq{margin-top:9px}
.rsr{gap:8px;padding:6px 9px;margin:5px 0 0;border-radius:10px}
.rsn{width:26px;height:26px;font-size:.82em}
.rsb b{font-size:.88em}.rsb small{font-size:.66em}
.rsr .tag{font-size:.68em;padding:0 8px}
.rsp{padding:7px 8px;margin:5px 0 8px;border-radius:10px}
.rst{margin:9px 0 5px;font-size:.7em;gap:6px}.rst:first-child{margin-top:1px}

function genAttr(S){const k=S.chaos/100,keys=A.map(x=>x[0]);

 const at={},w=keys.map(()=>(1-k)+k*Math.pow(Math.random(),3)*8+.2);keys.forEach(x=>at[x]=3);
 for(let i=Math.max(0,S.target-3*keys.length);i>0;i--)at[wpick(keys,w)]++;return at}

async function loadRecipes(){const o={};if(!db){try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('abl_'))try{const x=JSON.parse(localStorage.getItem(k));AB['ab_'+x.p+'_'+x.s]=x}catch(e){}if(k.startsWith('rcp_'))try{const x=JSON.parse(localStorage.getItem(k));o[x.p+'_'+x.s]=x}catch(e){}}}catch(e){}}else try{(await db.collection('recipes').get()).docs.forEach(d=>{const x=d.data();if(x&&x.m)o[d.id]=x;else if(x&&x.ab)AB[d.id]=x})}catch(e){}RECIPES={...RDEFM,...o};rgLoad()}
const STOPW=new Set(['واحد','واحده','واحدا','من','في','او','مل','غرام','غراما','غرامات','قطره','قطرات','قطع']);
const tok=x=>nrm(x).replace(/[+.،,:()\-]/g,' ').split(' ').map(w=>w.replace(/^ال(?=..)/,'')).filter(w=>w&&!STOPW.has(w)&&!/^\d+$/.test(w));
const tmatch=(a,b)=>{if(!a.length||!b.length)return false;const A=new Set(a),B=new Set(b),i=[...A].filter(x=>B.has(x)).length,u=A.size+B.size-i,mn=Math.min(A.size,B.size);return i==u||(i==mn&&mn>=2)||i/u>=.67};
const slotsOf=l=>(l||[]).map(x=>String(x).split('|').map(tok));
const assign=(names,sl)=>{const used=new Set(),hit=names.map(n=>{const t=tok(n),j=sl.findIndex((q,k)=>!used.has(k)&&q.some(b=>tmatch(t,b)));if(j<0)return null;used.add(j);return j});return{used,hit}};
const detect=(names,s)=>{const ns=names.filter(x=>tok(x).length);if(!ns.length)return null;const cd=[];Object.values(RECIPES).forEach(r=>{if(r.s!=s)return;const sl=slotsOf(r.m);if(!sl.length)return;const a=assign(ns,sl);if(a.hit.every(h=>h!==null))cd.push({p:r.p,s:r.s,rec:r,full:a.used.size>=sl.length})});const f=cd.filter(x=>x.full);return f.length==1?f[0]:f.length>1?{amb:1}:cd.length==1?cd[0]:cd.length?{amb:1}:null};
const auxOf=(r,ai)=>{const sl=slotsOf(r.rec.a);if(!sl.length)return ai;const a=assign(ai.map(x=>x.n),sl);return ai.filter((x,i)=>a.hit[i]!==null)};

 subH=x=>{const sb=x.sub||[];if(!sb.length&&!dm)return'';const fx=abForm=='sb'+x.id;return `<div class="rsub"><div class="rst">قدرات فرعية · ${sb.length}${dm?`<button class="tgl" data-a="abform" data-v="sb${x.id}" title="إضافة قدرة فرعية">${fx?'−':'+'}</button>`:''}</div>${sb.map((y,j)=>aedit==y.id&&dm?`<div class="itm itf"><input id="sen" value="${esc(y.n)}" placeholder="اسم القدرة الفرعية"><textarea id="sed" rows="5" placeholder="التأثير">${esc(y.d||'')}</textarea><div class="row"><button data-a="sbsave" data-id="${y.id}">حفظ</button><button data-a="abcancel">إلغاء</button></div></div>`:fold('sb'+y.id,j+1,y.n,'',y.d,'#a855f7',dm?`<button class="lb" data-a="abedit" data-id="${y.id}" title="تعديل">✎</button><button class="r" data-a="sbdel" data-id="${y.id}">✕</button>`:'')).join('')}${dm&&fx?`<div class="itf" style="margin-top:6px"><input id="sbn_${x.id}" placeholder="اسم قدرة فرعية جديدة"><textarea id="sbd_${x.id}" rows="4" placeholder="تأثير القدرة الفرعية"></textarea><div class="row"><button data-a="sbadd" data-id="${x.id}">+ إضافة قدرة فرعية</button></div></div>`:''}</div>`},
