/* ---- custom checkbox ---- */
input[type=checkbox]{-webkit-appearance:none;appearance:none;flex:none;width:20px!important;height:20px!important;margin:0;padding:0;border-radius:6px;background:#060a12;border:1.5px solid color-mix(in srgb,var(--g) 40%,var(--bd));display:inline-grid;place-items:center;cursor:pointer;transition:.15s;position:relative}
input[type=checkbox]::after{content:'';width:5px;height:10px;border:solid #030712;border-width:0 2.2px 2.2px 0;transform:rotate(45deg) scale(0);margin-top:-2px;transition:transform .15s ease}
input[type=checkbox]:hover:not(:disabled){border-color:var(--g)}
input[type=checkbox]:checked{background:linear-gradient(135deg,var(--g),var(--g2));border-color:var(--g);box-shadow:0 0 10px color-mix(in srgb,var(--g) 45%,transparent)}
input[type=checkbox]:checked::after{transform:rotate(45deg) scale(1)}
input[type=checkbox]:disabled{opacity:.45;cursor:not-allowed}
input[type=checkbox]:focus-visible{outline:2px solid var(--g);outline-offset:2px}

<script type="module">

 return null}};

 Q('#auth').style.display='none';Q('#uidb').innerHTML='معرّف حسابك: <bdi dir="ltr">'+u.uid+'</bdi>';
